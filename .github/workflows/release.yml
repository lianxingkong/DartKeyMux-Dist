name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_version:
        description: '强制指定打包版本号（留空则用 versions.env 的 PACKAGE_VERSION；tag 触发时以 tag 为准）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 解析版本号：tag > 手动输入 > versions.env
  # ---------------------------------------------------------------------------
  prepare:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      frontend: ${{ steps.resolve.outputs.frontend }}
      backend: ${{ steps.resolve.outputs.backend }}
      fakerinput_msi: ${{ steps.resolve.outputs.fakerinput_msi }}

    steps:
      - uses: actions/checkout@v4

      - name: 解析
        id: resolve
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck source=/dev/null
          source ./versions.env
          set +a

          version="$PACKAGE_VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          elif [ -n "${FORCE_VERSION:-}" ]; then
            version="$FORCE_VERSION"
          fi

          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::版本号 '$version' 不像 vX.Y.Z，拒绝发版"
            exit 1
          fi

          {
            echo "version=$version"
            echo "frontend=$FRONTEND_REPO@$FRONTEND_TAG"
            echo "backend=$BACKEND_REPO@$BACKEND_TAG"
            echo "fakerinput_msi=$FAKERINPUT_MSI"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 本次发版"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 包版本 | \`$version\` |"
            echo "| 前端 | \`$FRONTEND_REPO@$FRONTEND_TAG\` |"
            echo "| 后端 | \`$BACKEND_REPO@$BACKEND_TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 确认前后端 tag 与资产存在
        env:
          # 只用 PAT（可选）。两个仓库都是 public，不配也能匿名下载；
          # 但绝不能带本仓库的 GITHUB_TOKEN 去请求别的仓库（会 401）。
          CURL_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck source=/dev/null
          source ./versions.env
          set +a

          AUTH=()
          if [ -n "${CURL_TOKEN:-}" ]; then
            AUTH=(-H "Authorization: Bearer ${CURL_TOKEN}")
          fi

          check() {
            local url="https://github.com/$1/releases/download/$2/$3"
            echo "检查 $1@$2 -> $3"
            # -L 必须带：release 下载 URL 会 302 跳到 blob 存储
            curl -fsSIL --retry 3 --retry-delay 2 -o /dev/null "${AUTH[@]}" "$url" || {
              echo "::error::资产不存在: $url"
              exit 1
            }
          }

          check "$FRONTEND_REPO" "$FRONTEND_TAG" "$FRONTEND_ASSET"
          for arch in amd64 386; do
            check "$BACKEND_REPO" "$BACKEND_TAG" "${BACKEND_ASSET_TEMPLATE//\{arch\}/$arch}"
          done

  # ---------------------------------------------------------------------------
  # 打包：每个架构一个包
  # ---------------------------------------------------------------------------
  build:
    name: 打包 ${{ matrix.arch }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, 386]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: 安装 unzip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Resolve-Unzip {
            $cmd = Get-Command unzip -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd }
            foreach ($p in @(
              'C:\ProgramData\chocolatey\bin\unzip.exe',
              'C:\ProgramData\chocolatey\lib\unzip\tools\unzip.exe'
            )) {
              if (Test-Path $p) { return (Get-Item $p) }
            }
            return $null
          }

          $unzip = Resolve-Unzip
          if (-not $unzip) {
            Write-Host 'unzip not found, installing via chocolatey...'
            choco install unzip -y --no-progress | Out-Host
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $unzip = Resolve-Unzip
          }

          if (-not $unzip) {
            throw 'unzip 安装后仍找不到可执行文件，无法继续'
          }

          Write-Host ("using unzip: " + $unzip.Source)
          # 各实现的支持度不同；不支持 -Z1 也没关系，校验步骤会自动退化用 unzip -l
          try { & $unzip.Source -v 2>&1 | Select-Object -First 2 | Out-Host } catch { Write-Host 'unzip -v failed (ignored)' }

      - name: 执行 assemble.sh
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION_OVERRIDE: ${{ needs.prepare.outputs.version }}
          # 有 PAT 用 PAT；没有就给空串，让 assemble.sh 走匿名请求。
          # 不要在这里塞 secrets.GITHUB_TOKEN（跨仓库请求会 401）。
          GITHUB_TOKEN: ${{ secrets.PAT || '' }}
        run: |
          chmod +x scripts/assemble.sh
          ./scripts/assemble.sh

      - name: 校验产物结构
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION_OVERRIDE: ${{ needs.prepare.outputs.version }}
          FAKERINPUT_MSI: ${{ needs.prepare.outputs.fakerinput_msi }}
        shell: bash
        run: |
          set -euo pipefail
          zip_file="dist/app-${PACKAGE_VERSION_OVERRIDE}-windows-${ARCH}.zip"
          [ -f "$zip_file" ] || { echo "::error::没有产出 $zip_file"; exit 1; }

          # 各 runner 上的 unzip 不是同一个实现：
          #   Ubuntu Info-ZIP 支持 `unzip -Z1`（只列文件名）
          #   Windows(choco) 的 unzip 不支持 -Z1，会直接报错
          # 所以先试 -Z1，失败就退化用 `unzip -l` 并剥掉前 3 行 / 后 2 行的表头表尾。
          list_entries() { # zipfile
            local out
            if out="$(unzip -Z1 "$1" 2>/dev/null)" && [ -n "$out" ]; then
              printf '%s\n' "$out"
            else
              unzip -l "$1" | sed -e '1,3d' -e '$d' -e '$d' -e 's/^ *[0-9][0-9]* *[0-9-]* *[0-9:]* *//'
            fi
          }

          listing="$(list_entries "$zip_file" | tr -d '\r' | sed 's|^\./||; s|\\|/|g')"

          missing=0
          for required in \
            'start-amd64.bat' \
            'start-386.bat' \
            'app/app-release.apk' \
            'backend/amd64/GoKeyMux.exe' \
            'backend/386/GoKeyMux.exe' \
            'backend/amd64/Interception/library/x64/interception.dll' \
            'platform-tools/adb.exe' \
            'install-fakerinput.ps1' \
            'get-adb.ps1' \
            'README.md' ; do
            # 用 grep -c 而不是 grep -q：-q 提前退出会让上游 sed/unzip 收到 SIGPIPE，
            # 在 `set -euo pipefail` 下反而把整步判失败
            if [ "$(printf '%s\n' "$listing" | grep -cx -- "$required")" -gt 0 ]; then
              echo "ok   $required"
            else
              echo "::error::$zip_file 内缺少 $required"
              missing=1
            fi
          done

          # 包内还应有（可选）：FakerInput 驱动安装包、后端配置模板
          for optional in "${FAKERINPUT_MSI:-}" 'config.template.json'; do
            [ -n "$optional" ] || continue
            if printf '%s\n' "$listing" | grep -qx -- "$optional"; then
              echo "ok   $optional (可选)"
            else
              echo "::warning::$zip_file 内没有 $optional（可选文件）"
            fi
          done

          {
            echo "### \`$zip_file\` 内容清单"
            echo '```'
            printf '%s\n' "$listing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$missing" -ne 0 ]; then
            echo "::error::包内结构校验未通过，上面的清单即为实际内容"
            exit 1
          fi

      - name: 生成校验和
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION_OVERRIDE: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "app-$env:PACKAGE_VERSION_OVERRIDE-windows-$env:ARCH.zip"
          $path = Join-Path 'dist' $name
          if (-not (Test-Path $path)) { throw "缺少产物 $path" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLower()
          $line = "$hash  $name"
          Add-Content -Path 'dist/SHA256SUMS' -Value $line -Encoding ascii
          Write-Host $line

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 发布：合并所有产物，创建或更新 release
  # ---------------------------------------------------------------------------
  publish:
    name: 发布 release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      - name: 创建或更新 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          FE: ${{ needs.prepare.outputs.frontend }}
          BE: ${{ needs.prepare.outputs.backend }}
        run: |
          set -euo pipefail

          notes="$(mktemp)"
          {
            echo "## DartKeyMux 整合分发包 $VERSION"
            echo ""
            echo "解压即用：双击 \`start-amd64.bat\`（64 位系统，推荐）或 \`start-386.bat\`（32 位系统）。"
            echo ""
            echo "| 项 | 对应版本 |"
            echo "| --- | --- |"
            echo "| 前端 Flutter App | \`$FE\` |"
            echo "| 后端 GoKeyMux | \`$BE\` |"
            echo "| gRPC / adb reverse 端口 | \`50051\` |"
            echo ""
            echo "包内含：前端 APK、后端 GoKeyMux（amd64 + 386）、Android platform-tools（adb）、启动脚本、FakerInput 驱动安装包。"
            echo ""
            echo "请下载与你的版本号一致的 zip，并用 \`SHA256SUMS\` 校验完整性。"
            echo ""
            echo "> 本 release 的产物由 GitHub Actions 自动构建；前/后端版本号对齐关系记录在压缩包的 \`README.md\` 中。"
          } > "$notes"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION 已存在，改为上传资产（--clobber 覆盖同名文件）"
            gh release upload "$VERSION" dist/*.zip dist/SHA256SUMS --clobber
            gh release edit "$VERSION" --notes-file "$notes"
          else
            echo "创建 release $VERSION"
            gh release create "$VERSION" dist/*.zip dist/SHA256SUMS \
              --title "DartKeyMux $VERSION（整合分发）" \
              --notes-file "$notes"
          fi

          echo "### 已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION" >> "$GITHUB_STEP_SUMMARY"
